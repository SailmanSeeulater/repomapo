<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>repomapo</title>
    <script>
      // A theme chosen with the switch wins over the system one, and is applied before the first paint.
      try { var t = localStorage.getItem('repomapo-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t } catch (e) {}
    </script>
    <meta name="description" content="A map of a codebase, from the whole repo down to single lines: every file and what it uses, then threads from each definition to every usage." />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="margin: 0; padding: 2rem; font: 15px/1.5 system-ui, sans-serif">
        repomapo draws its maps in your browser, so it needs JavaScript. Turn it on and reload the page.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
