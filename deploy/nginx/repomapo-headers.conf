# Goes to /etc/nginx/snippets/repomapo-headers.conf on the VPS.
#
# Security headers for repomapo, included at server level and again in every
# location that sets its own add_header (nginx drops the inherited set in a
# location that declares one). Edit them here, once.

add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# The app talks to no outside host: scripts, styles and fonts are its own
# (fonts are self-hosted through @fontsource), and the only fetch is the index
# JSON from this origin. So ?data= can only name a file served from here; an
# index from anywhere else is opened from disk with "Open an index file",
# which reads it in the browser. Vite emits module scripts only, so script-src
# needs no 'unsafe-inline'; style-src keeps it for React style attributes and
# the inline styles the code panes are positioned with.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'" always;
